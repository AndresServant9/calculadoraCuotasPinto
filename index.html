<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Calculadora de cuotas · Balonmano Pinto</title><style>:root{--red:#e80d3d;--yellow:#f1e52b;--black:#242424;--bg:#f4f5f7;--line:#d9dce1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--black)}.app{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:18px;margin-bottom:22px}header img{width:100px;height:100px;object-fit:contain}h1{margin:0;font-size:2rem}header p{margin:4px 0;color:#666}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}.results{display:grid;gap:20px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 18px #0000000d;border:1px solid var(--line)}h2{margin-top:0}.controls label:not(.check){display:grid;gap:7px;font-weight:650;margin:15px 0}.controls select{padding:12px;border:1px solid #bbb;border-radius:10px;background:white;font-size:1rem}.check{display:flex;align-items:center;gap:10px;padding:11px 0}.check input{width:19px;height:19px;accent-color:var(--red)}.result{border-top:6px solid var(--red)}.costs{border:2px solid var(--yellow);border-top:6px solid var(--yellow)}.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em}.total{font-size:2.8rem;font-weight:850;margin:5px 0}.rows{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.row{display:flex;justify-content:space-between;gap:15px;padding:6px 0}.row.totalrow{font-weight:800;border-top:1px solid var(--line);margin-top:5px;padding-top:10px}.cost-head{display:flex;justify-content:space-between;gap:15px}.cost-head strong{font-size:1.6rem}.note,#summary,small{color:#666}.note{font-size:.9rem}.disabled{opacity:.5}@media(max-width:720px){.app{padding:14px}header img{width:78px;height:78px}h1{font-size:1.55rem}.grid{grid-template-columns:1fr}.total{font-size:2.4rem}}
</style>
<style>
@media(max-width:720px){
  body{min-width:0}
  .app{width:100%;max-width:520px;margin:0 auto;padding:14px 12px 32px}
  header{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d;border:1px solid var(--line)}
  header img{width:68px;height:68px;flex:0 0 68px}
  header div{min-width:0}
  header p{font-size:.86rem}
  .card{padding:18px;border-radius:16px}
  .controls select{width:100%;min-height:46px}
  .check{min-height:44px}
  .check input{width:22px;height:22px}
  .cost-head{align-items:flex-start}
  .row{font-size:.94rem}
}
</style>
</head><body><main class='app'><header><img src='logo.png' alt='Balonmano Pinto'><div><h1>Calculadora de cuotas</h1><p>Temporada 2026/27 · Balonmano Pinto</p></div></header><section class='grid'><form class='card controls'><h2>Datos del jugador</h2><label>Categoría<select id='cat'><option value='benjamin'>Benjamín</option><option value='alevin'>Alevín</option><option value='infantil'>Infantil</option><option value='cadete'>Cadete</option><option value='juvenil'>Juvenil</option><option value='senior'>Sénior</option></select></label><label>Mes de incorporación<select id='month'><option value='9'>Septiembre</option><option value='10'>Octubre</option><option value='11'>Noviembre</option><option value='12'>Diciembre</option><option value='1'>Enero</option><option value='2'>Febrero</option><option value='3'>Marzo</option><option value='4'>Abril</option><option value='5'>Mayo</option><option value='6'>Junio</option></select></label><label class='check'><input id='fed' type='checkbox' checked> Federado</label><label class='check'><input id='kit' type='checkbox'> Ropa (+80 €)</label><label class='check'><input id='member' type='checkbox'> Socio (−10 €)</label><label class='check'><input id='sibling' type='checkbox'> Hermano (−10 €)</label></form><div class='results'><section class='card result'><div class='eyebrow'>CUOTA DEL JUGADOR</div><div id='total' class='total'>300,00 €</div><p id='summary'></p><div id='breakdown' class='rows'></div></section><section class='card costs'><div class='cost-head'><div><div class='eyebrow'>GASTOS FIJOS PARA EL CLUB</div><small>Inscripción + seguro si se federa</small></div><strong id='clubTotal'>0,00 €</strong></div><div id='clubBreakdown' class='rows'></div><p id='clubNote' class='note'></p></section></div></section></main><script>const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);const data={benjamin:{ins:0,seg:0},alevin:{ins:25,seg:40.16},infantil:{ins:25,seg:40.16},cadete:{ins:25,seg:40.16},juvenil:{ins:25,seg:162.60},senior:{ins:25,seg:162.60}};const parts={9:10,10:10,11:9,12:8,1:7,2:6,3:5,4:4,5:3,6:2};const row=(a,b,total=false)=>`<div class="row ${total?'totalrow':''}"><span>${a}</span><span>${b}</span></div>`;function calc(){const c=$('cat').value,m=+$('month').value,ben=c==='benjamin',d=data[c],fixed=d.ins+d.seg;if(ben){$('fed').checked=false;$('fed').disabled=true}else $('fed').disabled=false;const fed=!ben&&$('fed').checked;const variableBase=ben?300:(fed?360-fixed:300),p=parts[m],variablePay=variableBase*p/10,base=(fed?fixed:0)+variablePay;const kit=$('kit').checked?80:0,member=$('member').checked?10:0,sibling=$('sibling').checked?10:0,total=Math.max(0,base+kit-member-sibling);$('total').textContent=money(total);$('summary').textContent=(m===9||m===10)?'Septiembre y octubre: cuota completa.':`Se aplican ${p}/10 partes de la parte variable.`;let h=fed?row('Parte fija incluida',money(fixed))+row('Parte variable anual',money(variableBase))+row(`Variable aplicada (${p}/10)`,money(variablePay)):row('Base variable anual',money(300))+row(`Variable aplicada (${p}/10)`,money(variablePay));h+=row('Cuota calculada',money(base),true);if(kit)h+=row('Ropa',money(80));if(member)h+=row('Descuento socio','−'+money(10));if(sibling)h+=row('Descuento hermano','−'+money(10));$('breakdown').innerHTML=h;if(fed){$('clubTotal').textContent=money(fixed);$('clubBreakdown').innerHTML=row('Inscripción federativa',money(d.ins))+row('Seguro',money(d.seg))+row('TOTAL GASTO FIJO',money(fixed),true);$('clubNote').textContent='Este coste se mantiene completo independientemente del mes de incorporación.'}else{$('clubTotal').textContent=money(0);$('clubBreakdown').innerHTML=row('Inscripción',money(0))+row('Seguro',money(0))+row('TOTAL GASTO FIJO',money(0),true);$('clubNote').textContent=ben?'Benjamín no se federa.':'Jugador no federado: sin gasto de inscripción ni seguro.'}}document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',calc));calc();
</script></body></html>
